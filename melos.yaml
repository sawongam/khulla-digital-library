name: khulla
repository: https://github.com/sawongam/khulla-digital-library

sdkPath: .fvm/flutter_sdk

packages:
  - .
  - packages/**

ide:
  intellij:
    enabled: false

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    description: Static analysis across all packages
    run: dart run melos exec --concurrency=1 -- dart analyze --fatal-infos

  format:
    description: Format Dart sources in all packages
    run: dart run melos exec --concurrency=1 -- dart format .

  fix:
    description: Apply dart fix across all packages
    run: dart run melos exec --concurrency=1 -- dart fix --apply

  test:
    description: Run tests in every package that has a test/ directory
    run: dart run melos exec --concurrency=1 --dir-exists=test -- flutter test

  codegen:
    description: Run build_runner in packages that depend on it
    run: dart run melos exec --concurrency=1 --order-dependents --depends-on=build_runner -- dart run build_runner build --delete-conflicting-outputs

  clean-codegen:
    description: Remove build_runner caches in all packages
    run: dart run melos exec -- rm -rf .dart_tool/build
