name: Release

# Landing on `prod` is what ships. Every push to it builds all four targets and
# publishes them as a release at the version in pubspec.yaml - no tag to push by
# hand, no second step to forget. The workflow creates the `v<version>` tag.
#
# So bumping `version:` in pubspec.yaml is part of the pull request, not an
# afterthought. A push whose version was already released publishes nothing and
# says so, rather than overwriting the release people already downloaded.
#
# Run it by hand ("Run workflow" in the Actions tab) on any branch to get the
# same four builds as downloadable artifacts with nothing published - that is
# how a tester gets a build of unreleased work.
on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      build: ${{ steps.resolve.outputs.build }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version being built
        id: resolve
        shell: bash
        run: |
          # pubspec.yaml is the single source of truth: the Flutter tool bakes
          # `version:` into every build, and the app reads it back at runtime
          # via package_info_plus - so the number in the release, the tag and
          # the About line cannot disagree.
          version="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          # The +build half. It is what an installed app compares to decide
          # whether a release is newer, so latest.json carries it.
          build_number="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[^+]*\+([0-9]+).*/\1/')"
          tag="v$version"

          # A manual run is for handing someone a build, never for publishing:
          # it can be fired from any branch, at any state of the version.
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            {
              echo "version=$version-dev.${GITHUB_SHA::7}"
              echo "build=true"
              echo "release=false"
            } >> "$GITHUB_OUTPUT"
            echo "Manual run - building \`$version-dev.${GITHUB_SHA::7}\` as artifacts. Nothing is published." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The tag is the record of what has already shipped. Re-releasing over
          # it would change what a download at that version contains, which is
          # exactly what a version number is supposed to rule out.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            {
              echo "version=$version"
              echo "build=false"
              echo "release=false"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::$tag is already released, so this push shipped nothing." \
                 "Bump version: in pubspec.yaml to release these changes."
            {
              echo "### No release"
              echo
              echo "\`$tag\` already exists, so this push published nothing."
              echo "Bump \`version:\` in \`pubspec.yaml\` and merge again to ship these changes."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The notes are the release page, Play's "What's new" and the
          # Store's - stop before an hour of builds rather than ship none.
          if ! tools/release_notes.sh "$version" >/dev/null; then
            echo "::error file=CHANGELOG.md::No notes for $version." \
                 "Add a \"## $version\" section and push again."
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "build=true"
            echo "build_number=$build_number"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing **$tag** from \`pubspec.yaml\`." >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter
        with:
          bootstrap: pub

      - name: Build
        run: flutter build windows --release -t lib/main_prod.dart

      # Two Windows artifacts: a portable zip (unzip anywhere, run khulla.exe)
      # and a per-user installer (Start Menu + uninstaller, no admin required).
      # Both bundle the same Release folder. The catalogue lives in the user's
      # application-support directory, so moving or replacing either artifact
      # never touches library data.
      - name: Package (portable zip)
        shell: pwsh
        run: |
          $name = "khulla-${{ needs.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/$name.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          iscc --version 2>$null
          if ($LASTEXITCODE -ne 0) {
            choco install innosetup --no-progress -y
            # Refresh PATH for this session so `iscc` is found without re-login.
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          }
          iscc /DMyAppVersion="${{ needs.version.outputs.version }}" windows/installer.iss
          Get-ChildItem dist | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

      # The Microsoft Store package: the same Release folder as an MSIX, which
      # the Store signs on certification - so Smart App Control, which blocks
      # the unsigned installer outright, lets it run. Config in `msix_config`
      # in pubspec.yaml; the identity comes from Partner Center (Product
      # identity) as repository variables. Until those are set, this step
      # skips rather than failing the release.
      #
      # Uploaded as its own artifact, never attached to the release: an
      # unsigned MSIX will not install outside the Store. The
      # `microsoft-store` job below submits it to Partner Center.
      - name: Package (Microsoft Store MSIX)
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          dart run msix:create `
            --identity-name "$env:MSIX_IDENTITY_NAME" `
            --publisher "$env:MSIX_PUBLISHER" `
            --publisher-display-name "$env:MSIX_PUBLISHER_DISPLAY_NAME" `
            --output-name "khulla-${{ needs.version.outputs.version }}-windows-x64-store"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build/msix | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        if: vars.MSIX_IDENTITY_NAME != ''
        with:
          name: microsoft-store
          path: build/msix/*.msix
          if-no-files-found: error

  linux:
    name: Linux
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libcups2-dev

      - uses: ./.github/actions/setup-flutter
        with:
          bootstrap: pub

      - name: Build
        run: flutter build linux --release -t lib/main_prod.dart

      - name: Package
        run: |
          name="khulla-${{ needs.version.outputs.version }}-linux-x64"
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  android:
    name: Android
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: ./.github/actions/setup-flutter
        with:
          bootstrap: pub

      # The APK has to be signed with the same key every release, or Android
      # refuses to install it over the last one - and the only way past that
      # is uninstalling, which deletes the library's data on the phone. A
      # runner's debug key is generated fresh on every run, so it cannot be
      # that key: this writes android/key.properties from the repository's
      # sideload key, which build.gradle.kts then signs with.
      #
      # Without the secrets it falls back to the debug key and warns - a
      # manual test build still works, but its APK cannot update anything.
      - name: Load the APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - the APK is" \
                 "debug-signed and cannot be installed over another release's APK."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/sideload-keystore.jks
          {
            echo "storeFile=sideload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # One universal APK rather than per-ABI splits: someone sideloading from
      # the release page should not have to know what a CPU architecture is.
      - name: Build
        run: flutter build apk --release -t lib/main_prod.dart

      - name: Package
        run: |
          name="khulla-${{ needs.version.outputs.version }}-android"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$name.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

      # The Google Play build: an app bundle signed with the upload key, not
      # the sideload key - Play only accepts uploads signed with the key it
      # was registered with, then re-signs them with its own app signing key.
      # The same build.gradle.kts reads key.properties, so this swaps it and
      # builds again. Without the secrets, Play is skipped and the rest ships.
      - name: Load the Play upload key
        id: upload-key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No ANDROID_UPLOAD_KEYSTORE_BASE64 secret - no Google Play build."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build (Google Play app bundle)
        if: steps.upload-key.outputs.present == 'true'
        run: |
          flutter build appbundle --release -t lib/main_prod.dart
          mkdir -p play
          cp build/app/outputs/bundle/release/app-release.aab \
            "play/khulla-${{ needs.version.outputs.version }}-android.aab"

      # Its own artifact, never on the release page: the bundle is for Play.
      - uses: actions/upload-artifact@v4
        if: steps.upload-key.outputs.present == 'true'
        with:
          name: google-play
          path: play/*.aab
          if-no-files-found: error

  web:
    name: Web
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter
        with:
          bootstrap: pub

      # Built at the site root, for a library serving it from its own host. The
      # GitHub Pages demo is built separately by deploy-web.yaml, which needs a
      # different base href.
      - name: Build
        run: flutter build web --release -t lib/main_prod.dart

      - name: Package
        run: |
          name="khulla-${{ needs.version.outputs.version }}-web"
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C build/web .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: needs.version.outputs.release == 'true'
    needs: [version, windows, linux, android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For CHANGELOG.md and tools/release_notes.sh.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p dist
          # The store packages go to the stores, not on the release page.
          find artifacts \( -path artifacts/microsoft-store -o -path artifacts/google-play \) -prune \
            -o -type f -exec mv {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -lh

      # What every installed copy of Khulla reads to find out whether it is
      # out of date: GET <repo>/releases/latest/download/latest.json. See
      # lib/features/updates/data/http_update_manifest_data_source.dart.
      #
      # It is a contract with every build ever shipped - old installs keep
      # reading it for as long as they run. `version`, `build` and `notes`
      # never change meaning; anything new is an added field.
      - name: Write the update manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build_number }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd dist
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          entry() {
            jq -n \
              --arg url "$base/$1" \
              --arg sha256 "$(sha256sum "$1" | cut -d' ' -f1)" \
              --argjson size "$(stat -c%s "$1")" \
              '{url: $url, sha256: $sha256, size: $size}'
          }
          jq -n \
            --arg version "$VERSION" \
            --argjson build "$BUILD" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --argjson windowsSetup "$(entry "khulla-$VERSION-windows-x64-setup.exe")" \
            --argjson windowsZip "$(entry "khulla-$VERSION-windows-x64.zip")" \
            --argjson linux "$(entry "khulla-$VERSION-linux-x64.tar.gz")" \
            --argjson web "$(entry "khulla-$VERSION-web.tar.gz")" \
            '{
              schema: 1,
              version: $version,
              build: $build,
              notes: $notes,
              downloads: {
                "windows-setup": $windowsSetup,
                "windows-zip": $windowsZip,
                "linux": $linux,
                "web": $web
              }
            }' > latest.json
          cat latest.json

      # The page is the hand-written notes and where to get the app - nothing
      # else. Everything that needs explaining lives in the guide.
      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MS_STORE_PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
        # The stores come first, as the official badges - they keep the app
        # updated, and the Store build is the one Smart App Control lets run.
        # Google's own PNG has transparent padding, which makes it sit
        # misaligned beside Microsoft's; the SVG has none, so both are 48px.
        run: |
          store="https://apps.microsoft.com/detail/${MS_STORE_PRODUCT_ID:-9NPZBD22X2L7}"
          play="https://play.google.com/store/apps/details?id=com.khulladigitallibrary.app"
          {
            tools/release_notes.sh "$VERSION"
            cat <<EOF

          ### Get it

          <a href="$store"><img src="https://get.microsoft.com/images/en-us%20dark.svg" alt="Get it from Microsoft" height="48"></a> <a href="$play"><img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play" height="48"></a>

          Or download a file below:
          - **Windows:** \`khulla-$VERSION-windows-x64-setup.exe\`
          - **Android:** \`khulla-$VERSION-android.apk\`
          - **Linux:** \`khulla-$VERSION-linux-x64.tar.gz\`
          - **Web:** [app.khulladigitallibrary.com](https://app.khulladigitallibrary.com)
          EOF
          } > release-notes.md
          cat release-notes.md

      # Creates the tag as well as the release - nobody tags by hand, and the
      # tag is what tells the next push to prod that this version has shipped.
      - uses: softprops/action-gh-release@v2
        with:
          name: Khulla ${{ needs.version.outputs.version }}
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: dist/*

  # The stores run after the GitHub release, so a store outage or a refused
  # submission never holds up the downloads. Each is switched on by setting
  # its variables and secrets, and skipped until then:
  #   google-play      GOOGLE_PLAY_TRACK (variable), GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
  #                    and the four ANDROID_UPLOAD_* secrets
  #   microsoft-store  MS_STORE_PRODUCT_ID (variable), MS_STORE_TENANT_ID,
  #                    MS_STORE_SELLER_ID, MS_STORE_CLIENT_ID, MS_STORE_CLIENT_SECRET
  google-play:
    name: Google Play
    if: needs.version.outputs.release == 'true' && vars.GOOGLE_PLAY_TRACK != ''
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: google-play
          path: play

      # Play reads "What's new" from one file per language.
      - name: Write "What's new"
        run: |
          mkdir -p whatsnew
          tools/release_notes.sh "${{ needs.version.outputs.version }}" --store > whatsnew/whatsnew-en-US

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.khulladigitallibrary.app
          releaseFiles: play/*.aab
          releaseName: ${{ needs.version.outputs.version }}
          tracks: ${{ vars.GOOGLE_PLAY_TRACK }}
          status: completed
          whatsNewDirectory: whatsnew

  microsoft-store:
    name: Microsoft Store
    if: needs.version.outputs.release == 'true' && vars.MS_STORE_PRODUCT_ID != ''
    needs: [version, publish]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: microsoft-store
          path: store

      - uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Sign in to Partner Center
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID `
            --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Git Bash, not `bash` from PowerShell - on a Windows runner that can
      # resolve to WSL.
      - name: Write "What's new"
        shell: bash
        run: tools/release_notes.sh "${{ needs.version.outputs.version }}" --store > whatsnew.txt

      # Upload the package as a draft, put the notes on every listing
      # language, then submit for certification. `publish` replaces any
      # draft already pending, so it has to come first.
      - name: Submit
        shell: pwsh
        env:
          PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
        run: |
          $msix = (Get-ChildItem store -Filter *.msix | Select-Object -First 1).FullName
          msstore publish $msix -id $env:PRODUCT_ID --noCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $notes = (Get-Content whatsnew.txt -Raw).Trim()

          $submission = msstore submission get $env:PRODUCT_ID | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($listing in $submission.Listings.PSObject.Properties) {
            $listing.Value.BaseListing.ReleaseNotes = $notes
          }
          msstore submission update $env:PRODUCT_ID ($submission | ConvertTo-Json -Depth 100 -Compress)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          msstore submission publish $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
