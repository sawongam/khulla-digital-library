<!doctype html>
<html lang="en">
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Try Khulla in your browser: a free, open-source library management system for schools and community libraries. Catalogue, circulation, members, fines and reports."
    />
    <meta name="theme-color" content="#0A6A66" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Khulla Digital Library" />
    <meta property="og:title" content="Khulla Digital Library: Web Demo" />
    <meta
      property="og:description"
      content="Try Khulla in your browser: a free, open-source library management system for schools and community libraries."
    />
    <meta property="og:url" content="https://app.khulladigitallibrary.com/" />
    <meta
      property="og:image"
      content="https://app.khulladigitallibrary.com/icons/icon-512.png"
    />
    <meta name="twitter:card" content="summary" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Khulla Digital Library" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png" />
    <link rel="shortcut icon" href="favicon.ico" />

    <title>Khulla Digital Library: Web Demo</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      /*
      Flutter web paints nothing until the engine and the app bundle have both
      loaded, which on a cold cache is long enough to read as a broken page.
      This placeholder holds the brand until the first frame, then removes
      itself. Keep it dependency-free and inline - a spinner that needs its own
      network round trip defeats the point.
    */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #ffffff;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          "Poppins",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #121212;
      }

      #loading .inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        transform: translateY(-4vh);
      }

      #loading .logo {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        display: block;
      }

      #loading .wordmark {
        margin: 4px 0 4px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        text-transform: uppercase;
      }

      #loading .track {
        width: 168px;
        height: 2px;
        border-radius: 2px;
        background-color: #ebe9f1;
        overflow: hidden;
      }

      #loading .track span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background-color: #0a6a66;
        animation: sweep 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      #loading .status {
        font-size: 12px;
        letter-spacing: 0.02em;
        color: #707070;
      }

      @keyframes sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(430%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #loading .inner {
          transform: none;
        }
        #loading .track span {
          animation: none;
          transform: none;
          margin: 0 auto;
        }
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #121212;
        }
        #loading {
          color: #ffffff;
        }
        #loading .track {
          background-color: #333333;
        }
        #loading .status {
          color: #b5b5b5;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      Khulla needs JavaScript to run in the browser. To download it for Windows,
      Linux or Android, visit
      <a href="https://khulladigitallibrary.com/">khulladigitallibrary.com</a>.
    </noscript>
    <div id="loading" role="status" aria-label="Loading Khulla">
      <div class="inner">
        <img class="logo" src="favicon.png" alt="" width="44" height="44" />
        <p class="wordmark">Khulla</p>
        <div class="track" aria-hidden="true"><span></span></div>
        <div class="status">Preparing your catalog</div>
      </div>
    </div>

    <script>
      window.addEventListener("flutter-first-frame", function () {
        var loading = document.getElementById("loading");
        if (loading) loading.remove();
      });
    </script>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
